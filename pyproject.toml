[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchvault"
version = "0.1.0"
description = "Organize papers, reading notes, and experiment records with Zotero and AI assistants."
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
pdf = ["pypdf>=6.21.2,<7", "fonttools>=4,<5"]

[project.scripts]
researchvault = "researchvault.cli:main"

[tool.setuptools]
packages = ["researchvault"]
